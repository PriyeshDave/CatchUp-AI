server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: any unmatched path falls back to index.html.
    # (We use HashRouter in React, so this is a safety net rather than a hard requirement.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
